  <path d="M120 256 L256 136 L392 256" fill="none" stroke="#ecf0f7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M156 236 V384 H356 V236" fill="none" stroke="#ecf0f7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Call: a source dot with two broadcast arcs. -->
  <circle cx="220" cy="304" r="20" fill="#8daeff"/>
  <path d="M251.1 272.9 A44 44 0 0 1 251.1 335.1" fill="none" stroke="#8daeff" stroke-width="18" stroke-linecap="round"/>
